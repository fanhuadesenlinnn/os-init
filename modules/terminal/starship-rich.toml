# os-init rich terminal prompt.
# Intended for local graphical terminals with a Nerd Font and truecolor support.

"$schema" = "https://starship.rs/config-schema.json"

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$golang\
$nodejs\
$python\
$rust\
$docker_context\
[](fg:green bg:sapphire)\
$cmd_duration\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$line_break\
$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Arch = "󰣇"
Debian = "󰣚"
Fedora = "󰣛"
Linux = "󰌽"
Macos = "󰀵"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Ubuntu = "󰕈"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust bold"
format = "[ $user]($style)"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = "[[ $symbol $branch ]($style)]($style)"

[git_status]
style = "bg:yellow fg:crust"
format = "[[$all_status$ahead_behind ]($style)]($style)"

[golang]
symbol = ""
style = "bg:green fg:crust"
format = "[[ $symbol $version ]($style)]($style)"

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = "[[ $symbol $version ]($style)]($style)"

[python]
symbol = ""
style = "bg:green fg:crust"
format = "[[ $symbol $version ]($style)]($style)"

[rust]
symbol = ""
style = "bg:green fg:crust"
format = "[[ $symbol $version ]($style)]($style)"

[docker_context]
symbol = ""
style = "bg:green fg:crust"
format = "[[ $symbol $context ]($style)]($style)"
only_with_files = true

[cmd_duration]
min_time = 1000
style = "bg:sapphire fg:crust"
format = "[ $duration ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = "[  $time ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[palettes.catppuccin_mocha]
crust = "#11111b"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
sapphire = "#74c7ec"
lavender = "#b4befe"

