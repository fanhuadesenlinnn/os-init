# os-init simple terminal prompt.
# Intended for SSH sessions: clear colors, no Nerd Font dependency, no powerline blocks.

"$schema" = "https://starship.rs/config-schema.json"

format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) "

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = "git:"
style = "bold yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style = "dimmed white"
format = "[$duration]($style) "

[line_break]
disabled = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

