# Alacritty 终端配置：OS Init Arch 默认终端之一。
# 字体、配色和窗口边距都在这里调整；启动命令由 ~/.local/bin/os-init-arch-terminal 统一选择。
[env]
TERM = "xterm-256color"

# 窗口交给 Hyprland 管理装饰，因此这里关闭原生标题栏。
[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0

# 默认使用 Monaco，与系统 UI 字体保持一致；中文和 Emoji 由 fontconfig 回退到 Noto。
[font]
size = 12.5

[font.normal]
family = "Monaco"
style = "Regular"

[font.bold]
family = "Monaco"
style = "Regular"

[font.italic]
family = "Monaco"
style = "Regular"

[colors.primary]
background = "#242424"
foreground = "#F2F2F2"

# 以下颜色偏向 foot 的明亮深灰终端观感，影响 ANSI 终端颜色。
[colors.cursor]
text = "#242424"
cursor = "#D9E0EE"

[colors.selection]
text = "#F2F2F2"
background = "#4B5263"

[colors.normal]
black = "#2E3440"
red = "#FF6B6B"
green = "#7DDB79"
yellow = "#FFD166"
blue = "#80BFFF"
magenta = "#C792EA"
cyan = "#5FD7D7"
white = "#D9E0EE"

[colors.bright]
black = "#5C6370"
red = "#FF8585"
green = "#95E88F"
yellow = "#FFE08A"
blue = "#9CCBFF"
magenta = "#DDB6FF"
cyan = "#7CEAEA"
white = "#FFFFFF"
