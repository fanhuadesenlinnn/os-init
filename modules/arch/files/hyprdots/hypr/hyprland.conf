### Hyprland 主配置：定义显示器、启动项、窗口规则、输入设备和快捷键。
################
### MONITORS ###
################
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################
# 常用程序变量。OS Init Arch 使用 os-init-arch-terminal 统一选择 Alacritty/foot。
$terminal = ~/.local/bin/os-init-arch-terminal
$fileManager = yazi
$menu = rofi -show run
$browser = google-chrome-stable
$taskManager = btop
$colorpicker = hyprpicker
$note = obsidian


#################
### AUTOSTART ###
#################
# 登录 Hyprland 后自动启动的服务和应用：剪贴板、输入法、通知、壁纸和状态栏。
# exec-once = hyprctl setcursor "Banana" 40
# exec = gsettings set org.gnome.desktop.interface cursor-theme "Banana"
# exec = gsettings set org.gnome.desktop.interface cursor-size 40

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = fcitx5 -d
exec-once = systemctl --user start hyprpolkitagent
exec-once = dunst
exec-once = hyprpaper & waybar
exec-once = ~/.local/bin/os-init-arch-vmware-resize

# source = ~/.config/hypr/hyprvim/init.conf
# exec-once = caelestia shell & hyprpaper
# exec-once = [workspace 1 silent] $browser
# exec-once = [workspace 2] $terminal -e tmux-session
exec-once = [workspace 2] $terminal
# Obsidian
# exec-once = [workspace 3] $note

# Optional OCR integration. Set this to your local OCR script before enabling
# the related keybind below.
# $OCR4Linux_ENG = /path/to/OCR4Linux.sh --lang eng


#############################
### Windows Rules ###
#############################
# 窗口规则用于把特定应用放到固定工作区，或调整浮动/透明等行为。

#windowrule = opacity 1 override 1 override 1.0 override, class:Code # For Overriding Opacity in VsCode
#windowrule = opacity 1 override 1 override 1.0 override, class:google-chrome # For Overriding Opacity in Chrome
# --- Workspace Assignments ---

# Workspace 1: Browsers
windowrule = match:class google-chrome, workspace 1 silent
windowrule = match:class firefox, workspace 1

# Workspace 2: Terminals
windowrule = match:class Alacritty, workspace 2
windowrule = match:class foot, workspace 2

# Workspace 3: Productivity & Dev
windowrule = match:class obsidian, workspace 3
windowrule = match:class Code, workspace 3
windowrule = match:class discord, workspace 3

# Workspace 4: Media & Tools (Silent)
windowrule = match:class hyprland-dialog, workspace 4
windowrule = match:class mpv, workspace 4 silent
windowrule = match:class Docker Desktop, workspace 4
windowrule = match:class GitKraken, workspace 4

# --- Visual Rules ---

# Opacity
# windowrule = match:class google-chrome, opacity 0.85 override

# Layer Rules (Animations)

#############################
### ENVIRONMENT VARIABLES ###
#############################
# Wayland 和中文输入法环境变量。fcitx 相关变量不要随意删除。
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = INPUT_METHOD,fcitx


#####################
### LOOK AND FEEL ###
#####################
# 外观参数：窗口间距、边框、布局、圆角、模糊和阴影。

general {
    gaps_in = 4
    gaps_out = 6

    # 沿用 i3 的清晰边界感：边框略粗，当前窗口一眼可见。
    border_size = 3

    col.active_border = rgb(6272a4)
    col.inactive_border = rgb(282a36)

    resize_on_border = true
    extend_border_grab_area = 30
    hover_icon_on_border = true
    resize_corner = 5
    allow_tearing = false


    # OS Init Arch keeps the vendored config usable on a stock Hyprland install.
    # The upstream rice used the optional scrolling layout; dwindle works without plugins.
    layout = dwindle
}

