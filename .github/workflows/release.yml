name: Build Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: os-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run shell script checks
        run: |
          set -euo pipefail
          bash -n modules/lib.sh modules/*/*.sh tooling/*.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck modules/lib.sh modules/*/*.sh tooling/*.sh

      - name: Run os-init package strategy checks
        run: bash tooling/test-lib-strategy.sh

      - name: Run embedded ArchDevKit checks
        run: bash modules/archdevkit/vendor/scripts/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          short_commit="$(git rev-parse --short HEAD)"
          package_name="${BINARY_NAME}_${GOOS}_${GOARCH}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${short_commit}" \
            -o "${package_dir}/${BINARY_NAME}" \
            .

          cp README.md "${package_dir}/README.md"
          tar -C "${package_dir}" -czf "dist/${package_name}.tar.gz" "${BINARY_NAME}" README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-init-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## OS Init

          面向中国大陆网络环境的系统初始化发布包。Linux 支持 Arch 系、Debian 系、RedHat 系；macOS 显示适配 Homebrew 的模块。

          ### 发布包

          - `os-init_linux_amd64.tar.gz`
          - `os-init_linux_arm64.tar.gz`
          - `os-init_darwin_amd64.tar.gz`
          - `os-init_darwin_arm64.tar.gz`
          - `checksums.txt`

          ### 主要能力

          - Linux 支持直接以 root 运行，用户配置写入 `/root`，且无需安装 sudo
          - root 模式隐藏 ArchDevKit，并跳过 Docker 用户组与重新登录步骤
          - Arch Linux root 模式通过 pacman 安装 mise，并在 `/root` 管理 Node.js 24、Python 3.13 和 Go 1.24
          - macOS 与 Arch Linux 共享 mise 运行时、国内镜像、官方源回退和安装验证逻辑
          - 中国大陆默认启用 Node/Go SDK、npm、pip、uv 和 Go module 镜像，SDK 镜像失败自动回退官方源
          - 登录 Shell 使用 mise shims，交互式 Shell 使用完整 activate，兼顾终端、IDE 和 GUI 应用
          - 移除 nvm/fnm/pyenv/asdf 运行时管理入口，迁移时只清理 OS Init 管理块并保留用户运行时数据
          - macOS Homebrew 软件逐项执行，日志、耗时和退出码互不影响
          - Motrix Next 使用 cask 级 Homebrew trust 和完整 tap 引用
          - ArchDevKit 安装 Docker 或 Mihomo 时，如果 systemd 暂时无法启动服务，不再中断整个 dev 安装流程
          - 中英双语 TUI，覆盖菜单、确认信息、执行状态和结果页
          - GitHub 专用代理与资源下载配置
          - 终端样式模块：本地图形终端 rich、SSH simple、TTY plain 自动切换
          - Starship 同时支持 bash 和 zsh，不再强制依赖 zsh
          - Mihomo 安装与 systemd 配置
          - 分平台安装策略：macOS 优先 Homebrew，Arch Linux 优先 pacman/paru/yay，其它 Linux 尽量使用官方二进制
          - Docker：Arch Linux 通过 pacman/AUR 安装组件，其它 Linux 使用静态二进制和 Compose CLI 插件
          - macOS/Linux 按 OS 自动过滤模块
          - Homebrew、Shell 配置块、systemd 服务状态检测
          - 安装日志自动清理 ANSI 颜色码
          - 模块级执行超时，避免安装器永久卡住
          - 按模块权限决定是否提前 sudo，Homebrew 模块不包 sudo
          - Homebrew 镜像变量统一注入
          - Arch Linux 下显示独立 ArchDevKit 菜单，完整保留 ArchDevKit 子系统能力
          - 模块执行计划器：强依赖自动补齐、软关联提示、稳定执行顺序
          - 按当前系统生成启动配置，Arch Linux 自动包含 ArchDevKit 桥接配置
          - ArchDevKit 默认 dev 开发环境，并默认启用 Mihomo/MetaCubeXD 代理能力
          - ArchDevKit shell 默认使用 Starship 终端样式，并保留 Powerlevel10k 可选配置
          - 安装总结页显示重新登录、shell 刷新、手动配置等后续动作
          - Go、Bash 和 ShellCheck 发布前检查
          NOTES

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OS Init ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
