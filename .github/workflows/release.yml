name: Build Release Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY_NAME: os-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Run complete checks
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Run Arch provider contracts in Arch Linux
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:base \
            bash modules/arch/scripts/test.sh

      - name: Upload check failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-check-log
          path: check.log
          if-no-files-found: error

  macos-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck --version

      - name: Run complete checks
        run: make check

  linux-matrix-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            family: debian
            arch: amd64
          - image: ubuntu:24.04
            family: debian
            arch: arm64
          - image: debian:12
            family: debian
            arch: amd64
          - image: fedora:42
            family: redhat
            arch: amd64
          - image: rockylinux:9
            family: redhat
            arch: amd64
          - image: archlinux:base
            family: arch
            arch: amd64
          - image: manjarolinux/base:latest
            family: arch
            arch: amd64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build target binary
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist-contract
          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}" \
            go build -trimpath -o "dist-contract/os-init-${TARGET_ARCH}" .

      - name: Run distribution contract
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/${TARGET_ARCH}" \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${IMAGE}" \
            bash tooling/test-distro-contract.sh \
              "${FAMILY}" "/workspace/dist-contract/os-init-${TARGET_ARCH}"

  system-integration:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/system-integration.yml

  build:
    needs: [test, macos-test, linux-matrix-test, system-integration]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="dev-${GITHUB_SHA::7}" ;;
          esac

          short_commit="$(git rev-parse --short HEAD)"
          package_name="${BINARY_NAME}_${GOOS}_${GOARCH}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${short_commit}" \
            -o "${package_dir}/${BINARY_NAME}" \
            .

          cp README.md "${package_dir}/README.md"
          tar -C "${package_dir}" -czf "dist/${package_name}.tar.gz" "${BINARY_NAME}" README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-init-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash tooling/release-notes.sh "${RELEASE_TAG}" > release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OS Init ${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OS Init ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
