name: Build Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: os-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          short_commit="$(git rev-parse --short HEAD)"
          package_name="${BINARY_NAME}_${GOOS}_${GOARCH}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${short_commit}" \
            -o "${package_dir}/${BINARY_NAME}" \
            .

          cp README.md "${package_dir}/README.md"
          tar -C "${package_dir}" -czf "dist/${package_name}.tar.gz" "${BINARY_NAME}" README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-init-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## OS Init

          面向中国大陆网络环境的系统初始化发布包。Linux 支持 Arch 系、Debian 系、RedHat 系；macOS 显示适配 Homebrew 或通用二进制安装的模块。

          ### 发布包

          - `os-init_linux_amd64.tar.gz`
          - `os-init_linux_arm64.tar.gz`
          - `os-init_darwin_amd64.tar.gz`
          - `os-init_darwin_arm64.tar.gz`
          - `checksums.txt`

          ### 主要能力

          - 中文 TUI
          - GitHub 专用代理与资源下载配置
          - Mihomo 安装与 systemd 配置
          - Docker Engine 静态二进制安装
          - Docker Compose CLI 插件安装
          - macOS/Linux 按 OS 自动过滤模块
          - Homebrew、Shell 配置块、systemd 服务状态检测
          - 安装日志自动清理 ANSI 颜色码
          NOTES

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OS Init ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
