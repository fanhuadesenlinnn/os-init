name: Build Release Packages

on:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: os-init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run shell script checks
        run: |
          set -euo pipefail
          bash -n modules/lib.sh modules/provider.sh modules/*/*.sh tooling/*.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck modules/lib.sh modules/provider.sh modules/*/*.sh tooling/*.sh

      - name: Run os-init package strategy checks
        run: bash tooling/test-lib-strategy.sh

      - name: Run Arch capability checks
        run: |
          bash modules/arch/scripts/test.sh
          shellcheck -x $(find modules/arch -type f -name '*.sh' -print)

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            refs/heads/release/v*) version="${GITHUB_REF_NAME#release/v}" ;;
            *) version="dev-${GITHUB_SHA::7}" ;;
          esac

          short_commit="$(git rev-parse --short HEAD)"
          package_name="${BINARY_NAME}_${GOOS}_${GOARCH}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${short_commit}" \
            -o "${package_dir}/${BINARY_NAME}" \
            .

          cp README.md "${package_dir}/README.md"
          tar -C "${package_dir}" -czf "dist/${package_name}.tar.gz" "${BINARY_NAME}" README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-init-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF_NAME#release/}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > release-notes.md <<NOTES
          ## OS Init ${RELEASE_TAG}

          面向中国大陆网络环境的 macOS / Linux 系统初始化发布包。

          ### 本版本修复

          - 修复 Arch Linux provider 调用已删除 \`preflight_install\` 导致所有 Arch 能力无法执行的问题。
          - 统一 Go 控制面与 Shell provider 的 Mihomo 组件标识，避免 \`mihomo\` 无法分发到代理安装模块。
          - 清理 Arch 状态动作对旧计划层 \`modules_for_target\` 的残留引用。
          - 增加 Arch 入口加载、组件分发、doctor/status 动作的契约测试。

          ### 发布包

          - \`os-init_linux_amd64.tar.gz\`
          - \`os-init_linux_arm64.tar.gz\`
          - \`os-init_darwin_amd64.tar.gz\`
          - \`os-init_darwin_arm64.tar.gz\`
          - \`checksums.txt\`
          NOTES

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OS Init ${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "OS Init ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
