name: System Integration

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 6"

permissions:
  contents: read

jobs:
  linux-package-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            family: debian
          - image: debian:12
            family: debian
          - image: fedora:42
            family: redhat
          - image: rockylinux:9
            family: redhat
          - image: archlinux:base
            family: arch
          - image: manjarolinux/base:latest
            family: arch
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run root and normal-user package lifecycle
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -e OS_INIT_CONTAINER_TEST=1 \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${IMAGE}" \
            bash tooling/run-linux-lifecycle.sh "${FAMILY}"

  macos-homebrew-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Homebrew formula lifecycle
        run: bash tooling/test-macos-lifecycle.sh
